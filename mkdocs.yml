site_name: AspireWorld
site_url: https://mcaspireworld.github.io/wiki/
site_description: Вики анархии AspireWorld (Minecraft 1.21.4) — правила, команды, донат, рейды, ивенты, экономика.
repo_url: https://github.com/MCAspireWorld/wiki
repo_name: MCAspireWorld/wiki
edit_uri: edit/main/docs/
copyright: AspireWorld © 2026 · mc.aspireworld.ru

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/header.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/AspireWorld
      name: Telegram
    - icon: fontawesome/brands/discord
      link: https://discord.gg/4vcw34k3cq
      name: Discord
    - icon: material/web
      link: https://aspireworld.ru
      name: Сайт и донат

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: На этой странице
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md
  - Анархия:
      - База знаний:
          - 🌎 О режиме AspireWorld: anarchy/index.md
          - ❓ Часто задаваемые вопросы: anarchy/faq.md
          - 📄 Правила сервера: anarchy/rules.md
          - 🧭 Команды: anarchy/commands.md
      - Деньги и торговля:
          - 💰 Монеты и зарплата: anarchy/economy.md
          - 🧾 Скупщик и магазин: anarchy/seller.md
          - 🏷️ Аукцион: anarchy/auction.md
          - 🎰 Игровой зал: anarchy/casino.md
      - Фарм и развитие:
          - ✨ Опыт: anarchy/exp.md
          - 🔮 Зачарования и наковальня: anarchy/anvil.md
          - 🧪 Зелья: anarchy/potions.md
      - Приваты и взрывчатка:
          - 🏡 Приваты: anarchy/regions.md
          - 🧨 Динамит: anarchy/tnt.md
          - 🧱 Защитные блоки: anarchy/blocks.md
      - PvP:
          - ⚔️ Режим PvP: anarchy/pvp.md
          - 💀 Смерть и возрождение: anarchy/death.md
      - Ивенты:
          - 🎉 Мини-ивенты: anarchy/minievents.md
          - 🏜️ Песчаные Раскопки: anarchy/pesok.md
          - 🗺️ Большие ивенты: anarchy/events.md
      - Прогресс:
          - 🎫 Боевой пропуск: anarchy/battlepass.md
          - 🛡️ Кланы: anarchy/clans.md
          - 🎁 Наборы, кейсы и рюкзак: anarchy/kits.md
          - 🎨 Профиль и кастомизация: anarchy/profile.md
      - Донат:
          - 👑 Привилегии: anarchy/donate.md
          - ⭐ Premium и Platinum: anarchy/premium.md
      - Модерация:
          - 📨 Жалобы: anarchy/reports.md
          - 🔎 Проверка на читы: anarchy/check.md
